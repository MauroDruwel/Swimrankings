name: Docs Coverage & Sync

on:
  push:
    branches: [main]
    paths: ["swimrankings/**", "pyproject.toml", "setup.py"]
  schedule:
    # Weekly on Monday at 06:15 UTC
    - cron: "15 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write

jobs:
  docs-check:
    uses: MauroDruwel/quality-gate/.github/workflows/docs-check.yml@main
    with:
      mode: "pr"
      docs-paths: "README.md,docs/pages"
      source-paths: "swimrankings"
      extra-instructions: "Docs site uses Nextra in docs/pages/*.mdx (registered in docs/pages/_meta.json). Keep README.md, quick-start.mdx, examples.mdx, error-handling.mdx, installation.mdx, and contributing.mdx aligned with swimrankings/__init__.py, swimrankings/http.py, swimrankings/search.py, swimrankings/athlete.py, and pyproject.toml."
